  <script type="text/javascript">
    /**
     * 把接口里的百分比字符串(如 "12.5%")转成数字 12.5
     * 遇到 null / undefined / 空串 / "-" / NaN 一律返回 null,方便上层做空值判断
     */
    function parsePercentValue(value) {
      if (value === null || value === undefined || value === '' || value === '-') {
        return null
      }
      const parsed = parseFloat(value)
      return Number.isNaN(parsed) ? null : parsed
    }

    /**
     * 根据 series 数据算出 y 轴的 min / max / interval
     * 最小值 >= 10% 时取 数据最小值 - 10 留出顶部呼吸空间,否则回落到 0%,搭配 100% 切成 5 个刻度
     * 入参 data.series 需要先经过 formatEchartData 填充
     */
    function getChartBounds(data) {
      const values = data.series
        .flatMap((item) => item.data)
        .filter((value) => typeof value === 'number')

      if (!values.length) {
        return { min: 0, max: 100, interval: 25 }
      }

      // 备注：最小值 >= 10% 时取 数据最小值 - 10(给最高点 label 留缓冲),否则回落到 0%,与 100% 组成 5 个刻度
      const minValue = Math.min(...values)
      const axisMin = minValue >= 10 ? minValue - 10 : 0

      return {
        min: axisMin,
        max: 100,
        interval: (100 - axisMin) / 4,
      }
    }

    /**
     * 把 y 轴刻度值格式化成百分比文案
     * 整数显示成 "100%",带 1 位小数的保留小数位(如 "12.5%"),避免 "12.0%" 这种噪音
     */
    function formatAxisPercent(value) {
      const roundedValue = Math.round(value * 10) / 10
      return Number.isInteger(roundedValue)
        ? `${roundedValue}%`
        : `${roundedValue.toFixed(1)}%`
    }

    /**
     * 把 dataObj 的原始结构(按 truck 嵌套)转成表格可消费的二维数组
     * 同时把列头(item.column)和行数据(item.formatedData)挂回 item 上,供 renderTable 直接使用
     * 第一列固定是 truckName,后面列按 columnKey 顺序对齐,缺失值填空串
     */
    function formatTableData(item) {
      const { data, columnKey, valueKey, listKey } = item
      const column = data[0][listKey].map((value) => value[columnKey])
      item.column = column

      const result = []
      data.forEach((truck) => {
        const rowData = column.map((col) => {
          const found = truck[listKey].find((current) => current[columnKey] === col)
          return found ? found[valueKey] : ''
        })
        rowData.unshift(truck.truckName)
        result.push(rowData)
      })

      item.formatedData = result
      return result
    }

    /**
     * 根据 item.formatedData 生成 <table> HTML 并挂到对应容器
     * 不达标的格子(item.condition 返回 true)会加 warning-cell 红色背景
     * 空格子用 "-" 占位(由 .cell:empty::after CSS 规则统一处理)
     * 第一列加 title-column 灰色背景,加粗字体,作为行标识
     */
    function renderTable(item) {
      const container = document.getElementById(item.id)
      let html = `
      <table id="${item.id}" class="table ${item.class}">
        <thead>
          <tr>
            <th>${item.title}${item.description ? `<br><span class="description">${item.description}</span>` : ''}</th>
            ${item.column.map((header) => `<th>${header}</th>`).join('')}
          </tr>
        </thead>
        <tbody>
    `

      item.formatedData.forEach((row) => {
        html += '<tr>'
        row.forEach((data, idx) => {
          const condition = item.condition(data)
          html += `<td class="cell ${condition ? 'warning-cell' : ''} ${idx === 0 ? 'title-column' : ''}">${data || ''}</td>`
        })
        html += '</tr>'
      })

      html += '</tbody></table>'
      const tableDom = document.createElement('div')
      tableDom.innerHTML = html
      container.appendChild(tableDom)
    }

    const chartPalette = ['#6f7bf7', '#ff9f7f', '#51c8f2', '#f6a23c', '#4f86ff']
    const chartShadowPalette = ['rgba(111, 123, 247, 0.22)', 'rgba(255, 159, 127, 0.22)', 'rgba(81, 200, 242, 0.22)', 'rgba(246, 162, 60, 0.22)', 'rgba(79, 134, 255, 0.22)']

    /**
     * 将接口数据转换成 ECharts 可消费的 xAxis / series
     * 这里主要影响折线数据排布、灰色分组背景、绿色基线文字、底部 grouplabel
     */
    function formatEchartData(that) {
      const xAxis = []
      const groupLabels = []
      const groupRanges = []
      const groupSize = that.data[0]?.stateResultDetails?.length || 0
      const totalSize = groupSize * that.data.length
      const series = []
      const markAreaData = []

      that.data.forEach((item, itemIndex) => {
        const color = chartPalette[itemIndex % chartPalette.length]
        groupLabels.push(item.truckName)
        const offset = itemIndex * groupSize

        // 备注：groupRanges 决定底部 grouplabel 的左右范围、文案和示例色
        groupRanges.push([offset, offset + groupSize - 1, item.truckName, color])

        // 备注：每条线会先铺一层 null，占住其他 group 的位置，确保曲线只出现在自己的分组里
        const lineData = Array.from({ length: totalSize }, () => null)

        item.stateResultDetails.forEach((detail, detailIndex) => {
          xAxis.push(detail.timeRange)
          lineData[offset + detailIndex] = parsePercentValue(detail[that.valueKey])
        })

        if (itemIndex % 2 === 1 && groupSize) {
          // 备注：这里控制哪些 group 需要灰底，目前是奇数位 group 着色
          markAreaData.push([offset, offset + groupSize - 1])
        }

        series.push({
          name: item.truckName,
          type: 'line',
          // 备注：smooth 控制折线是否圆滑
          smooth: true,
          connectNulls: false,
          showSymbol: true,
          symbol: 'circle',
          // 备注：symbolSize 控制每个点的圆圈大小
          symbolSize: 7,
          lineStyle: {
            // 备注：width 控制线宽
            width: 2,
            // 备注：显式指定线条颜色,避免被 itemStyle.color(#fff) 覆盖成白色
            color: color,
            // 备注：shadowBlur / shadowOffsetY / shadowColor 控制折线阴影
            shadowBlur: 8,
            shadowOffsetY: 8,
            shadowColor: chartShadowPalette[itemIndex % chartShadowPalette.length],
          },
          itemStyle: {
            // 备注：color 控制圆点填充(白色 = 空心效果)
            color: '#fff',
            // 备注：borderColor / borderWidth 控制圆点描边,用线条颜色保持视觉一致
            borderColor: color,
            borderWidth: 1.5,
            // 备注：这里的 shadow* 控制圆点阴影
            shadowBlur: 8,
            shadowOffsetY: 3,
            shadowColor: chartShadowPalette[itemIndex % chartShadowPalette.length],
          },
          label: {
            // 备注：label 这一组配置控制折线上方百分比文案
            show: true,
            position: 'top',
            distance: 6,
            color: 'rgba(0, 0, 0, 0.70)',
            fontSize: 10,
            formatter(params) {
              return typeof params.value === 'number' ? `${params.value}%` : ''
            },
          },
          data: lineData,
        })
      })

      if (series[0]) {
        // 备注：markLine 负责画绿色达成率基线
        series[0].markLine = {
          symbol: 'none',
          lineStyle: {
            color: '#86b93b',
            type: 'dashed',
            // 备注：基线虚线宽度，2px 比 1px 在浅灰分组背景上更清晰
            width: 2,
          },
          label: {
            show: false,
          },
          data: [{ yAxis: that.average }],
        }
      }

      if (markAreaData.length) {
        series.unshift({
          name: '__group_band__',
          type: 'custom',
          coordinateSystem: 'cartesian2d',
          silent: true,
          clip: true,
          // 备注：z 越小越靠底层，确保灰底压在折线下方
          z: 0,
          tooltip: {
            show: false,
          },
          renderItem(params, api) {
            const startIndex = api.value(0)
            const endIndex = api.value(1)

            // 备注：stepWidth 是单个 x 轴类目占据的像素宽度
            const stepWidth = totalSize ? params.coordSys.width / totalSize : 0
            // 备注：left / width 共同决定灰底从哪里开始、铺多宽
            const left = params.coordSys.x + (startIndex * stepWidth)
            const width = (endIndex - startIndex + 1) * stepWidth

            return {
              type: 'rect',
              silent: true,
              shape: {
                x: left,
                y: params.coordSys.y,
                width,
                height: params.coordSys.height,
              },
              style: {
                // 备注：fill 控制灰色分组背景颜色和透明度
                fill: 'rgba(244, 246, 249, 0.5)',
              },
            }
          },
          data: markAreaData,
        })
      }

      series.push({
        name: '__baseline_label__',
        type: 'custom',
        silent: true,
        clip: false,
        tooltip: {
          show: false,
        },
        renderItem(params, api) {
          const point = api.coord([0, api.value(0)])

          return {
            type: 'text',
            silent: true,
            style: {
              // 备注：这里额外绘制一层文字，让 96% 贴左侧显示，视觉上接近 y 轴刻度
              text: `${api.value(0)}%`,
              // 备注：x 越小越靠左，y 跟随绿色基线高度
              x: params.coordSys.x - 8,
              y: point[1],
              fill: '#8EC655',
              fontSize: 12,
              fontWeight: 700,
              textAlign: 'right',
              textVerticalAlign: 'middle',
            },
          }
        },
        data: [[that.average]],
      })

      series.push({
        name: '__group_labels__',
        type: 'custom',
        silent: true,
        clip: false,
        tooltip: {
          show: false,
        },
        renderItem(params, api) {
          const startIndex = api.value(0)
          const endIndex = api.value(1)
          const label = api.value(2)
          const color = api.value(3)
          const startPoint = api.coord([startIndex, 0])
          const endPoint = api.coord([endIndex, 0])
          const x = (startPoint[0] + endPoint[0]) / 2

          // 备注：74 控制 grouplabel 与 x 轴文字之间的垂直间距
          const y = params.coordSys.y + params.coordSys.height + 74
          // 备注：这几个值共同控制示例短线、圆点、文字的水平排布
          const textWidth = String(label).length * 6.2
          const lineStartX = x - (textWidth / 2) - 18
          const lineEndX = lineStartX + 14
          const circleX = lineStartX + 7

          return {
            type: 'group',
            silent: true,
            children: [
              {
                type: 'line',
                shape: {
                  // 备注：x1/y1/x2/y2 控制示例短线长度和位置
                  x1: lineStartX,
                  y1: y + 5,
                  x2: lineEndX,
                  y2: y + 5,
                },
                style: {
                  // 备注：stroke / lineWidth 控制示例短线颜色和粗细
                  stroke: color,
                  lineWidth: 1.5,
                },
              },
              {
                type: 'circle',
                shape: {
                  // 备注：cx / cy / r 控制示例圆点位置和大小
                  cx: circleX,
                  cy: y + 5,
                  r: 2.5,
                },
                style: {
                  fill: '#fff',
                  stroke: color,
                  lineWidth: 1.5,
                },
              },
              {
                type: 'text',
                style: {
                  // 备注：这里控制 grouplabel 文字颜色、字号、对齐方式
                  text: label,
                  x: lineEndX + 6,
                  y,
                  fill: '#000000',
                  fontSize: 12,
                  fontWeight: 500,
                  textAlign: 'left',
                  textVerticalAlign: 'top',
                },
              },
            ],
          }
        },
        data: groupRanges,
      })

      that.xAxis = xAxis
      that.series = series
      that.groupLabels = groupLabels
    }

    /**
     * 组装 ECharts option 并渲染实例
     * 这里主要影响坐标轴、tooltip、绘图区留白、纵向虚线和最终挂载的 series
     */
    function loadEchart(data) {
      const echartRef = document.getElementById(data.id)
      const instance = echarts.init(echartRef, null, {
        renderer: 'canvas',
      })
      echartElements.push(instance)
      const { xAxis, series } = data
      const bounds = getChartBounds(data)
      const option = {
        title: {
          text: '',
          left: 0,
          top: 0,
          textStyle: {
            color: '#111827',
            fontSize: 13,
            fontWeight: 700,
          },
        },
        // 备注：全局折线配色按这个数组顺序取值
        color: chartPalette,
        grid: {
          // 备注：left / right / top / bottom 控制图表主体和容器四周的留白
          left: 42,
          right: 18,
          top: 22,
          bottom: 118,
        },
        tooltip: {
          show: false,
          // // 备注：tooltip 控制鼠标悬停时的浮层样式
          // trigger: 'axis',
          // backgroundColor: 'rgba(17, 24, 39, 0.9)',
          // borderWidth: 0,
          // textStyle: {
          //   color: '#fff',
          //   fontSize: 12,
          // },
          // valueFormatter(value) {
          //   return typeof value === 'number' ? `${value}%` : '-'
          // },
        },
        yAxis: {
          type: 'value',
          // 备注：splitNumber + interval + min + max 共同决定 y 轴有几个刻度以及刻度值
          splitNumber: 4,
          interval: bounds.interval,
          min: bounds.min,
          max: bounds.max,
          splitLine: {
            // 备注：false 表示不显示 echarts 默认横向辅助线
            show: false,
          },
          axisLine: {
            show: false,
          },
          axisTick: {
            show: false,
          },
          axisLabel: {
            // 备注：这里控制 y 轴文字颜色、字号和格式
            color: '#000',
            fontSize: 10,
            formatter(value) {
              return formatAxisPercent(value)
            },
          },
        },
        xAxis: {
          type: 'category',
          data: xAxis,
          boundaryGap: true,
          axisLine: {
            // 备注：x 轴底部主轴线颜色
            lineStyle: {
              color: '#d9dee8',
            },
          },
          axisLabel: {
            // 备注：rotate 控制旋转角度，margin 控制标签与轴线距离
            rotate: 90,
            interval: 0,
            margin: 8,
            color: '#000',
            fontSize: 10,
          },
          axisTick: {
            show: false,
          },
          splitLine: {
            // 备注：这里控制图内纵向虚线的显示、颜色、线型和粗细
            show: true,
            lineStyle: {
              color: '#d7e1f0',
              type: 'dashed',
              width: 1,
            },
          },
          splitArea: {
            show: false,
          },
        },
        series,
      }
      instance.setOption(option)
    }
    /**
     * 入口函数:遍历 renderList 把配置渲染成真实 DOM
     * 每个根节点是 <section>,下面挂 section-title + 多个子节点(table 或 echart)
     * 子节点挂载完后再调用 format / render 完成数据准备和图表渲染
     */
    function init() {
      const app = document.getElementById('echartsDemo')
      renderList.forEach(root => {
        // 根节点
        const rootDom = document.createElement('section');
        rootDom.id = root.id;
        rootDom.className = root.class;
        const titleDom = document.createElement('h4');
        titleDom.className = 'section-title';
        titleDom.textContent = root.title;
        rootDom.appendChild(titleDom);
        app.appendChild(rootDom);
        var children = root.children;
        for (var i = 0; i < children.length; i++) {
          var item = children[i];
          // 子节点
          const childDom = document.createElement('div');
          childDom.id = item.type === 'echart' ? `${item.id}-wrap` : item.id;
          childDom.className = item.type === 'echart' ? 'chart-block' : item.class;
          rootDom.appendChild(childDom);
          // 提示
          if (item.tip) {
            const tipDom = document.createElement('h4');
            tipDom.className = 'section-tip';
            tipDom.textContent = item.tip;
            childDom.appendChild(tipDom);
          }
          if (item.type === 'echart') {
            const chartTitleDom = document.createElement('div');
            chartTitleDom.className = 'chart-title';
            chartTitleDom.textContent = item.title;
            childDom.appendChild(chartTitleDom);
            const chartDom = document.createElement('div');
            chartDom.id = item.id;
            chartDom.className = item.class;
            childDom.appendChild(chartDom);
          }
          if (typeof item.format === "function") {
            item.format(item);
          }
          if (typeof item.render === "function") {
            item.render(item);
          }
        }
      });
    }
    init()
  </script>
</body>
