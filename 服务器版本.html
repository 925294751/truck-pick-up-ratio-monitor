<!doctype html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>LTL发货/上网时效监控</title>
  <script src="echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px 0 32px 0;
      font-family: Arial, sans-serif;
      color: #000000;
      background: #fff;
      min-width: 1920px;
    }

    .container {
      margin-bottom: 36px;
    }

    .section-title,
    .section-tip,
    .chart-title {
      font-weight: 700;
    }

    .section-title {
      margin-bottom: 24px;
      font-size: 26px;
    }

    .section-tip {
      margin-bottom: 12px;
      font-size: 16px;
      line-height: 24px;
    }

    /* 备注：section-tip / chart-title 前面的三角箭头，用 CSS border 画法还原设计稿 */
    .section-tip::before,
    .chart-title::before {
      content: '';
      display: inline-block;
      width: 12px;
      height: 12px;
      background: #4f73f6;
      clip-path: polygon(0 0,
      100% 50%,
      0 100%,
      22% 50%);
      margin-right: 6px;
    }

    .chart-block {
      margin-top: 8px;
    }

    .chart-title {
      margin-bottom: 12px;
      font-size: 16px;
      line-height: 20px;
    }

    /* table */
    .table {
      font-size: 12px;
      border-collapse: collapse;
      background: #fff;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .table th,
    .table td {
      font-family: Arial, sans-serif;
      border: 1px solid #303133;
      padding: 9px 0;
      text-align: center;
      color: #000;
      font-size: 14px;
      width: 100px;
    }

    .table th {
      background: #F2F3F5;
      font-weight: 500;
      letter-spacing: 0;
    }

    tr th:first-child {
      width: 230px;
    }

    .table td {
      font-weight: 400;
    }

    .description {
      font-size: 12px;
      font-weight: 400;
      font-weight: normal;
    }

    .cell:empty::after {
      content: '-'
    }

    .warning-cell {
      background: #FDE2E2 !important;
    }


    /* echart */
    .echarts-container {
      height: 410px;
      width: 1920px;
      background: #fff;
    }

    h4,
    h6 {
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>

<script type="text/javascript">
  /**
   * 把接口里的百分比字符串(如 "12.5%")转成数字 12.5
   * 遇到 null / undefined / 空串 / "-" / NaN 一律返回 null,方便上层做空值判断
   */
  function parsePercentValue(value) {
    var parsed
    if (value === null || value === undefined || value === '' || value === '-') {
      return null
    }
    parsed = parseFloat(value)
    return isNaN(parsed) ? null : parsed
  }

  /**
   * 根据 series 数据算出 y 轴的 min / max / interval
   * 最小值 >= 10% 时取 数据最小值 - 10 留出顶部呼吸空间,否则回落到 0%,搭配 100% 切成 5 个刻度
   * 入参 data.series 需要先经过 formatEchartData 填充
   */
  function getChartBounds(data) {
    var values = []
    var i
    var j
    var currentSeries
    var currentValue
    var minValue
    var axisMin

    for (i = 0; i < data.series.length; i++) {
      currentSeries = data.series[i]
      if (!currentSeries || !currentSeries.data) {
        continue
      }
      for (j = 0; j < currentSeries.data.length; j++) {
        currentValue = currentSeries.data[j]
        if (typeof currentValue === 'number') {
          values.push(currentValue)
        }
      }
    }

    if (!values.length) {
      return { min: 0, max: 100, interval: 25 }
    }

    minValue = Math.min.apply(Math, values)
    axisMin = minValue >= 10 ? minValue - 10 : 0

    return {
      min: axisMin,
      max: 100,
      interval: (100 - axisMin) / 4
    }
  }

  /**
   * 把 y 轴刻度值格式化成百分比文案
   * 整数显示成 "100%",带 1 位小数的保留小数位(如 "12.5%"),避免 "12.0%" 这种噪音
   */
  function formatAxisPercent(value) {
    var roundedValue = Math.round(value * 10) / 10
    if (roundedValue % 1 === 0) {
      return roundedValue + '%'
    }
    return roundedValue.toFixed(1) + '%'
  }

  /**
   * 把 dataObj 的原始结构(按 truck 嵌套)转成表格可消费的二维数组
   * 同时把列头(item.column)和行数据(item.formatedData)挂回 item 上,供 renderTable 直接使用
   * 第一列固定是 truckName,后面列按 columnKey 顺序对齐,缺失值填空串
   */
  function formatTableData(item) {
    var data = item.data
    var columnKey = item.columnKey
    var valueKey = item.valueKey
    var listKey = item.listKey
    var column = []
    var result = []
    var i
    var j
    var k
    var truck
    var rowData
    var col
    var found
    var currentList

    // 备注：表头需要汇总所有 truck 的区域/时间列，避免只取第一条时漏掉后续数据里的 CA/NJ
    for (i = 0; i < data.length; i++) {
      currentList = data[i][listKey] || []
      for (j = 0; j < currentList.length; j++) {
        col = currentList[j][columnKey]
        if (column.indexOf(col) === -1) {
          column.push(col)
        }
      }
    }
    item.column = column

    for (i = 0; i < data.length; i++) {
      truck = data[i]
      rowData = [truck.truckName]
      for (j = 0; j < column.length; j++) {
        col = column[j]
        found = ''
        currentList = truck[listKey]
        for (k = 0; k < currentList.length; k++) {
          if (currentList[k][columnKey] === col) {
            found = currentList[k][valueKey]
            break
          }
        }
        rowData.push(found)
      }
      result.push(rowData)
    }

    item.formatedData = result
    return result
  }

  /**
   * 根据 item.formatedData 生成 <table> HTML 并挂到对应容器
   * 不达标的格子(item.condition 返回 true)会加 warning-cell 红色背景
   * 空格子用 "-" 占位(由 .cell:empty::after CSS 规则统一处理)
   * 第一列加 title-column 灰色背景,加粗字体,作为行标识
   */
  function renderTable(item) {
    var container = document.getElementById(item.id)
    var html = ''
    var i
    var j
    var row
    var data
    var condition
    var tableDom

    html += '<table id="' + item.id + '" class="table ' + item.class + '">'
    html += '<thead><tr>'
    html += '<th>' + item.title
    if (item.description) {
      html += '<br><span class="description">' + item.description + '</span>'
    }
    html += '</th>'
    for (i = 0; i < item.column.length; i++) {
      html += '<th>' + item.column[i] + '</th>'
    }
    html += '</tr></thead><tbody>'

    for (i = 0; i < item.formatedData.length; i++) {
      row = item.formatedData[i]
      html += '<tr>'
      for (j = 0; j < row.length; j++) {
        data = row[j]
        condition = item.condition(data)
        html += '<td class="cell '
        html += condition ? 'warning-cell ' : ''
        html += j === 0 ? 'title-column' : ''
        html += '">' + (data || '') + '</td>'
      }
      html += '</tr>'
    }

    html += '</tbody></table>'
    tableDom = document.createElement('div')
    tableDom.innerHTML = html
    container.appendChild(tableDom)
  }

  var EMAIL_CHART_HEIGHT = 410
  var EMAIL_CHART_WIDTH = 1920
  var EMAIL_CHART_FONT_FAMILY = 'Arial, sans-serif'
  // 修改点1：baseline_label 未与 baseline 保持垂直居中，这组参数专门控制左侧 baseline 文案
  var BASELINE_LABEL_FONT_SIZE = 13
  var BASELINE_LABEL_FONT_WEIGHT = 700
  var BASELINE_LABEL_X_OFFSET = 8
  var BASELINE_LABEL_VISUAL_OFFSET_Y = 6
  var GROUP_LABEL_FONT_SIZE = 13
  var GROUP_LABEL_FONT_WEIGHT = 400
  var GROUP_LABEL_APPROX_CHAR_WIDTH = 6.2
  var GROUP_LABEL_LINE_LENGTH = 14
  var GROUP_LABEL_TEXT_GAP = 6
  var GROUP_LABEL_CIRCLE_RADIUS = 3
  var GROUP_LABEL_LINE_WIDTH = 2
  // 备注：grouplabel 整组（图标 + 文字）的水平微调量，正数右移，负数左移
  var GROUP_LABEL_VISUAL_OFFSET_X = 0
  // 备注：仅最后一个 grouplabel 的水平微调量，正数右移，负数左移
  var GROUP_LABEL_LAST_VISUAL_OFFSET_X = 46.5
  var GROUP_LABEL_TEXT_VISUAL_OFFSET_Y = 4
  // 验证用：打开后会在每个 group 中心画一条红色辅助线，用来判断是中心点偏了还是 grouplabel 整块偏了
  var GROUP_LABEL_DEBUG_CENTER_LINE = false
  // 修改点2：x 轴日期标签先占固定宽度，再右对齐后旋转，避免不同日期字符串长度导致视觉中心漂移
  var X_AXIS_LABEL_FIXED_WIDTH = 57

  var chartPalette = ['#8979ff', '#ff928a', '#3cc3df', '#ffae4c', '#537ff1']
  // var chartShadowPalette = ['rgba(111, 123, 247, 0.22)', 'rgba(255, 159, 127, 0.22)', 'rgba(81, 200, 242, 0.22)', 'rgba(246, 162, 60, 0.22)', 'rgba(79, 134, 255, 0.22)']

  function getChartTextFont(fontSize, fontWeight, fontFamily) {
    return String(fontWeight || 400) + ' ' + String(fontSize || 12) + 'px ' + String(fontFamily || 'Arial')
  }

  function getChartTextRect(text, fontSize, fontWeight, fontFamily) {
    var font = getChartTextFont(fontSize, fontWeight, fontFamily)
    var content = String(text || '')
    var textRect

    if (typeof echarts !== 'undefined' && echarts.format && typeof echarts.format.getTextRect === 'function') {
      textRect = echarts.format.getTextRect(content, font)
    } else if (typeof echarts !== 'undefined' && echarts.graphic && typeof echarts.graphic.getTextRect === 'function') {
      textRect = echarts.graphic.getTextRect(content, font)
    }

    if (textRect) {
      return {
        width: textRect.width || 0,
        height: textRect.height || fontSize
      }
    }

    return {
      width: content.length * GROUP_LABEL_APPROX_CHAR_WIDTH,
      height: fontSize
    }
  }

  /**
   * 将接口数据转换成 ECharts 可消费的 xAxis / series
   * 这里主要影响折线数据排布、灰色分组背景、绿色基线文字、底部 grouplabel
   */
  function formatEchartData(that) {
    var xAxis = []
    var groupLabels = []
    var groupRanges = []
    var groupSize = 0
    var totalSize = 0
    var series = []
    var markAreaData = []
    var itemIndex
    var detailIndex
    var item
    var detail
    var color
    var offset
    var lineData
    var fillIndex

    if (that.data[0] && that.data[0].stateResultDetails) {
      groupSize = that.data[0].stateResultDetails.length
    }
    totalSize = groupSize * that.data.length

    for (itemIndex = 0; itemIndex < that.data.length; itemIndex++) {
      item = that.data[itemIndex]
      color = chartPalette[itemIndex % chartPalette.length]
      groupLabels.push(item.truckName)
      offset = itemIndex * groupSize

      // 备注：groupRanges 决定底部 grouplabel 的左右范围、文案和示例色
      groupRanges.push([offset, offset + groupSize - 1, item.truckName, color])

      // 备注：每条线会先铺一层 null，占住其他 group 的位置，确保曲线只出现在自己的分组里
      lineData = []
      for (fillIndex = 0; fillIndex < totalSize; fillIndex++) {
        lineData.push(null)
      }

      for (detailIndex = 0; detailIndex < item.stateResultDetails.length; detailIndex++) {
        detail = item.stateResultDetails[detailIndex]
        xAxis.push(detail.timeRange)
        lineData[offset + detailIndex] = parsePercentValue(detail[that.valueKey])
      }

      if (itemIndex % 2 === 1 && groupSize) {
        // 备注：这里控制哪些 group 需要灰底，目前是奇数位 group 着色
        markAreaData.push([offset, offset + groupSize - 1])
      }

      series.push({
        name: item.truckName,
        type: 'line',
        // 备注：smooth 控制折线是否圆滑
        smooth: true,
        connectNulls: true,
        showSymbol: true,
        symbol: 'circle',
        // 备注：symbolSize 控制每个点的圆圈大小
        symbolSize: 7,
        lineStyle: {
          // 备注：width 控制线宽
          width: 2,
          // 备注：显式指定线条颜色,避免被 itemStyle.color(#fff) 覆盖成白色
          color: color,
          // 备注：shadowBlur / shadowOffsetY / shadowColor 控制折线阴影
          // shadowBlur: 8,
          // shadowOffsetY: 8,
          // shadowColor: chartShadowPalette[itemIndex % chartShadowPalette.length]
        },
        itemStyle: {
          // 备注：color 控制圆点填充(白色 = 空心效果)
          color: '#fff',
          // 备注：borderColor / borderWidth 控制圆点描边,用线条颜色保持视觉一致
          borderColor: color,
          borderWidth: 1.5,
          // 备注：这里的 shadow* 控制圆点阴影
          // shadowBlur: 8,
          // shadowOffsetY: 3,
          // shadowColor: chartShadowPalette[itemIndex % chartShadowPalette.length]
        },
        label: {
          // 备注：label 这一组配置控制折线上方百分比文案
          show: true,
          position: 'top',
          distance: 6,
          color: '#000',
          fontSize: 12,
          fontWeight: 400,
          fontFamily: EMAIL_CHART_FONT_FAMILY,
          formatter: function (params) {
            return typeof params.value === 'number' ? params.value + '%' : ''
          }
        },
        data: lineData
      })
    }

    if (series[0]) {
      // 备注：markLine 负责画绿色达成率基线
      series[0].markLine = {
        symbol: 'none',
        lineStyle: {
          color: '#86b93b',
          type: 'dashed',
          // 备注：基线虚线宽度，2px 比 1px 在浅灰分组背景上更清晰
          width: 2
        },
        label: {
          show: false
        },
        data: [{ yAxis: that.average }]
      }
    }

    if (markAreaData.length) {
      series.unshift({
        name: '__group_band__',
        type: 'custom',
        coordinateSystem: 'cartesian2d',
        silent: true,
        clip: true,
        // 备注：z 越小越靠底层，确保灰底压在折线下方
        z: 0,
        tooltip: {
          show: false
        },
        renderItem: function (params, api) {
          var startIndex = api.value(0)
          var endIndex = api.value(1)
          var stepWidth = totalSize ? params.coordSys.width / totalSize : 0
          var left = params.coordSys.x + (startIndex * stepWidth)
          var width = (endIndex - startIndex + 1) * stepWidth

          return {
            type: 'rect',
            silent: true,
            shape: {
              x: left,
              y: params.coordSys.y,
              width: width,
              height: params.coordSys.height
            },
            style: {
              // 备注：fill 控制灰色分组背景颜色和透明度
              fill: 'rgba(244, 246, 249, 0.5)'
            }
          }
        },
        data: markAreaData
      })
    }

    series.push({
      name: '__baseline_label__',
      type: 'custom',
      silent: true,
      clip: false,
      tooltip: {
        show: false
      },
      renderItem: function (params, api) {
        var point = api.coord([0, api.value(0)])
        // 修改点1：先测出 baseline_label 的真实文字尺寸，再按文字高度反推顶部坐标
        var baselineText = api.value(0) + '%'
        var baselineTextRect = getChartTextRect(baselineText, BASELINE_LABEL_FONT_SIZE, BASELINE_LABEL_FONT_WEIGHT, EMAIL_CHART_FONT_FAMILY)
        var baselineTextTopY = point[1] - (baselineTextRect.height / 2) + BASELINE_LABEL_VISUAL_OFFSET_Y
        return {
          type: 'text',
          silent: true,
          style: {
            // 备注：这里额外绘制一层文字，让 96% 贴左侧显示，视觉上接近 y 轴刻度
            text: baselineText,
            // 备注：x 越小越靠左，y 跟随绿色基线高度
            // 修改点1：x 控制 baseline_label 离 y 轴的距离
            x: params.coordSys.x - BASELINE_LABEL_X_OFFSET,
            // 修改点1：y 改为文字顶部坐标，避免 middle 基线漂移
            y: baselineTextTopY,
            fill: '#8EC655',
            font: getChartTextFont(BASELINE_LABEL_FONT_SIZE, BASELINE_LABEL_FONT_WEIGHT, EMAIL_CHART_FONT_FAMILY),
            fontSize: BASELINE_LABEL_FONT_SIZE,
            fontWeight: BASELINE_LABEL_FONT_WEIGHT,
            fontFamily: EMAIL_CHART_FONT_FAMILY,
            textAlign: 'right',
            // 修改点1：改成 top，对齐逻辑由 baselineTextTopY 接管
            textVerticalAlign: 'top'
          }
        }
      },
      data: [[that.average]]
    })

    series.push({
      name: '__group_labels__',
      type: 'custom',
      silent: true,
      clip: false,
      tooltip: {
        show: false
      },
      renderItem: function (params, api) {
        var startIndex = api.value(0)
        var endIndex = api.value(1)
        var label = api.value(2)
        var color = api.value(3)
        var textRect = getChartTextRect(label, GROUP_LABEL_FONT_SIZE, GROUP_LABEL_FONT_WEIGHT, EMAIL_CHART_FONT_FAMILY)
        var startPoint = api.coord([startIndex, 0])
        var endPoint = api.coord([endIndex, 0])
        // 备注：x 是整个「图标 + 文字」组合的水平中心点
        var x = (startPoint[0] + endPoint[0]) / 2
        // 备注：y 是 grouplabel 所在的基准区域顶部，再往下 5px 作为图标中心线
        var y = params.coordSys.y + params.coordSys.height + 74
        var iconCenterY = y + 5
        var textWidth = textRect.width
        // 备注：让「示例线段 + 文字间距 + 文本」整体围绕 x 居中
        var labelBlockWidth = GROUP_LABEL_LINE_LENGTH + GROUP_LABEL_TEXT_GAP + textWidth
        var groupVisualOffsetX = GROUP_LABEL_VISUAL_OFFSET_X
        if (endIndex === totalSize - 1) {
          groupVisualOffsetX += GROUP_LABEL_LAST_VISUAL_OFFSET_X
        }
        var lineStartX = x - (labelBlockWidth / 2) + groupVisualOffsetX
        var lineEndX = lineStartX + GROUP_LABEL_LINE_LENGTH
        var circleX = lineStartX + (GROUP_LABEL_LINE_LENGTH / 2)
        var textStartX = lineEndX + GROUP_LABEL_TEXT_GAP
        // 备注：后端转 PNG 时 middle 基线容易漂，这里按真实文字高度计算顶部 y
        var textTopY = iconCenterY - (textRect.height / 2) + GROUP_LABEL_TEXT_VISUAL_OFFSET_Y

        return {
          type: 'group',
          silent: true,
          children: [
            GROUP_LABEL_DEBUG_CENTER_LINE ? {
              type: 'line',
              silent: true,
              shape: {
                x1: x,
                y1: params.coordSys.y + params.coordSys.height - 6,
                x2: x,
                y2: iconCenterY + 18
              },
              style: {
                stroke: '#ff4d4f',
                lineWidth: 1,
                lineDash: [3, 3],
                opacity: 0.85
              }
            } : null,
            {
              type: 'line',
              shape: {
                x1: lineStartX,
                y1: iconCenterY,
                x2: lineEndX,
                y2: iconCenterY
              },
              style: {
                stroke: color,
                lineWidth: GROUP_LABEL_LINE_WIDTH
              }
            },
            {
              type: 'circle',
              shape: {
                cx: circleX,
                cy: iconCenterY,
                r: GROUP_LABEL_CIRCLE_RADIUS
              },
              style: {
                fill: '#fff',
                stroke: color,
                lineWidth: GROUP_LABEL_LINE_WIDTH
              }
            },
            {
              type: 'text',
              style: {
                text: label,
                x: textStartX,
                y: textTopY,
                fill: '#000000',
                font: getChartTextFont(GROUP_LABEL_FONT_SIZE, GROUP_LABEL_FONT_WEIGHT, EMAIL_CHART_FONT_FAMILY),
                fontSize: GROUP_LABEL_FONT_SIZE,
                fontWeight: GROUP_LABEL_FONT_WEIGHT,
                fontFamily: EMAIL_CHART_FONT_FAMILY,
                textAlign: 'left',
                textVerticalAlign: 'top'
              }
            }
          ].filter(function (child) {
            return !!child
          })
        }
      },
      data: groupRanges
    })

    that.xAxis = xAxis
    that.series = series
    that.groupLabels = groupLabels
  }

  /**
   * 组装 ECharts option 并渲染实例
   * 这里主要影响坐标轴、tooltip、绘图区留白、纵向虚线和最终挂载的 series
   */
  function loadEchart(data) {
    var echartRef = document.getElementById(data.id)
    echartRef.style.height = EMAIL_CHART_HEIGHT + 'px'
    echartRef.style.width = EMAIL_CHART_WIDTH + 'px'
    var instance = echarts.init(echartRef, null, {
      // 修改点3：当前是本地浏览器预览，不能开启 ssr；否则 ECharts 不会按常规 DOM 方式渲染到页面
      renderer: 'svg',
      ssr: true
    })
    var xAxis = data.xAxis
    var series = data.series
    var bounds = getChartBounds(data)
    var option

    echartElements.push(instance)
    option = {
      backgroundColor: '#ffffff',
      animation: false,
      title: {
        text: '',
        left: 0,
        top: 0,
        textStyle: {
          color: '#111827',
          fontSize: 13,
          fontWeight: 700,
          fontFamily: EMAIL_CHART_FONT_FAMILY
        }
      },
      // 备注：全局折线配色按这个数组顺序取值
      color: chartPalette,
      grid: {
        // 备注：left / right / top / bottom 控制图表主体和容器四周的留白
        left: 42,
        right: 18,
        // left: 0,
        // right: 0,
        top: 32,
        bottom: 122
      },
      tooltip: {
        show: false
      },
      yAxis: {
        type: 'value',
        // 备注：splitNumber + interval + min + max 共同决定 y 轴有几个刻度以及刻度值
        splitNumber: 4,
        interval: bounds.interval,
        min: bounds.min,
        max: bounds.max,
        splitLine: {
          // 备注：false 表示不显示 echarts 默认横向辅助线
          show: false
        },
        axisLine: {
          show: false
        },
        axisTick: {
          show: false
        },
        axisLabel: {
          // 备注：这里控制 y 轴文字颜色、字号和格式
          color: '#000',
          fontSize: 11,
          fontFamily: EMAIL_CHART_FONT_FAMILY,
          formatter: function (value) {
            return formatAxisPercent(value)
          }
        }
      },
      xAxis: {
        type: 'category',
        data: xAxis,
        boundaryGap: true,
        axisLine: {
          // 备注：x 轴底部主轴线颜色
          lineStyle: {
            color: '#d9dee8'
          }
        },
        axisLabel: {
          // 备注：rotate 控制旋转角度，margin 控制标签与轴线距离
          // 修改点2：日期需要与区间正中间垂直对齐；旋转 90 度后，verticalAlign 控制这个效果
          rotate: 90,
          interval: 0,
          margin: 8,
          // 备注：align 控制旋转文字在区间里的水平锚点
          align: 'right',
          // 备注：verticalAlign 控制旋转文字在区间里的垂直锚点，middle 对应图1那种居中效果
          verticalAlign: 'top',
          color: '#000',
          fontSize: 11,
          fontFamily: EMAIL_CHART_FONT_FAMILY
        },
        axisTick: {
          show: false
        },
        splitLine: {
          // 备注：这里控制图内纵向虚线的显示、颜色、线型和粗细
          show: true,
          lineStyle: {
            color: '#d7e1f0',
            type: 'dashed',
            width: 1
          }
        },
        splitArea: {
          show: false
        }
      },
      series: series
    }
    instance.setOption(option)
  }

  /**
   * 入口函数:遍历 renderList 把配置渲染成真实 DOM
   * 每个根节点是 <section>,下面挂 section-title + 多个子节点(table 或 echart)
   * 子节点挂载完后再调用 format / render 完成数据准备和图表渲染
   */
  function init() {
    var rootIndex
    var root
    var rootDom
    var titleDom
    var children
    var i
    var item
    var childDom
    var tipDom
    var chartTitleDom
    var chartDom

    for (rootIndex = 0; rootIndex < renderList.length; rootIndex++) {
      root = renderList[rootIndex]
      // 根节点
      rootDom = document.createElement('echartsDemo')
      rootDom.id = root.id
      rootDom.className = root.class
      // 提示
      if (root.tip) {
        const rootTipDom = document.createElement('h4')
        rootTipDom.className = 'section-tip'
        rootTipDom.textContent = root.tip
        rootDom.appendChild(rootTipDom)
      }
      titleDom = document.createElement('h4')
      titleDom.className = 'section-title'
      titleDom.textContent = root.title
      rootDom.appendChild(titleDom)
      document.body.appendChild(rootDom)
      children = root.children
      for (i = 0; i < children.length; i++) {
        item = children[i]
        // 子节点
        childDom = document.createElement('div')
        childDom.id = item.type === 'echart' ? item.id + '-wrap' : item.id
        childDom.className = item.type === 'echart' ? 'chart-block' : item.class
        rootDom.appendChild(childDom)
        // // 提示
        // if (item.tip) {
        //   tipDom = document.createElement('h4')
        //   tipDom.className = 'section-tip'
        //   tipDom.textContent = item.tip
        //   childDom.appendChild(tipDom)
        // }
        if (item.type === 'echart') {
          chartTitleDom = document.createElement('div')
          chartTitleDom.className = 'chart-title'
          chartTitleDom.textContent = item.title
          childDom.appendChild(chartTitleDom)
          chartDom = document.createElement('div')
          chartDom.id = item.id
          chartDom.className = item.class
          childDom.appendChild(chartDom)
        }
        if (typeof item.format === 'function') {
          item.format(item)
        }
        if (typeof item.render === 'function') {
          item.render(item)
        }
      }
    }
  }

  init()
</script>
